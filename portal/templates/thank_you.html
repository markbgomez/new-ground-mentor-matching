<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You · New Ground</title>
  <link rel="stylesheet" href="/ui/theme.css">
  <link rel="stylesheet" href="/ui/components.css">
  <style>
    body { background-color: #f7f9fa; }
    .portal-container {
      max-width: 600px;
      margin: 60px auto;
      padding: var(--space-lg);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="portal-container">
    <div class="card" style="border-top: 6px solid var(--p127-green); padding: 40px 24px;">
      <span class="eyebrow">RESPONSE CONFIRMED</span>
      <h2 style="margin-bottom: 16px;">{{ headline }}</h2>
      <p style="font-size: 1.05rem; color: #555; line-height: 1.7; margin-bottom: 24px;">{{ message }}</p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary">Return to Coordinator Pipeline</a>
        <a href="https://www.project127.org" target="_blank" class="btn btn-outline">Visit Project 1.27</a>
      </div>
    </div>
  </div>
</body>
</html>
